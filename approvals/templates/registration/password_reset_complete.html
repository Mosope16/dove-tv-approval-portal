{% extends 'approvals/base.html' %}

{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 0 auto; margin-top: 50px; text-align: center;">
    <i class="fas fa-check-circle" style="font-size: 3rem; color: #81c784; margin-bottom: 15px;"></i>
    <h2 style="margin: 0; color: white;">Password Updated!</h2>
    <p style="color: var(--text-muted); font-size: 1rem; margin-top: 15px;">
        Your password has been set. You may go ahead and log in now.
    </p>
    <div style="margin-top: 30px;">
        <a href="{% url 'login' %}" class="btn-pink" style="text-decoration: none; padding: 15px 30px; font-size: 1.1rem;">
            Log In Now
        </a>
    </div>
</div>
{% endblock %}
