{% extends 'approvals/base.html' %}

{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 0 auto; margin-top: 50px; text-align: center;">
    <i class="fas fa-envelope-open-text" style="font-size: 3rem; color: var(--accent-brand); margin-bottom: 15px;"></i>
    <h2 style="margin: 0; color: white;">Reset Password</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Enter your email address and we will send you a secure link to reset your password.</p>

    <form method="post" style="margin-top: 25px; text-align: left;">
        {% csrf_token %}
        <label style="display: block; font-weight: bold; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;">
            Email Address
        </label>
        {{ form.email }}
        
        <button type="submit" class="btn-pink" style="width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 10px;">
            Send Reset Link
        </button>
    </form>
    
    <div style="margin-top: 20px;">
        <a href="{% url 'login' %}" style="color: #4fc3f7; text-decoration: none; font-size: 0.9rem;"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
</div>
{% endblock %}
